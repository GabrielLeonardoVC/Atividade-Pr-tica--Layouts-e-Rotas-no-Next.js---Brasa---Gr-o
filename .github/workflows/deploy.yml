name: Deploy Next.js (GitHub Pages)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# evita publishes concorrentes no mesmo site
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    env:
      # liga o modo de exportação estática do next.config.ts
      NEXT_STATIC_EXPORT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build estático (gera a pasta ./out)
        run: npm run build:static

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy nas Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
